# dsh-adobe-mcp 配置示例
#
# 使用方法：把本文件复制到 %APPDATA%\dsh-adobe-mcp\config.toml
#           （仓库根目录的 config.toml 会覆盖用户级配置，仅用于开发期）
#
# 优先级：命令行参数 > 环境变量 > 配置文件 > 内置默认值
# 环境变量形式：DSH_ADOBE_MCP__<大写路径，用 __ 分隔>
#           例如 DSH_ADOBE_MCP__HOSTS__PREMIERE__EVAL_TIMEOUT_S=60
#           列表值用逗号分隔，例如 DSH_ADOBE_MCP__TOOLS__ENABLED_GROUPS=core,export
#
# 本文件由 python scripts/render_config_example.py 生成，与配置模型保持同步；
# 手改本文件会导致 tests/unit/test_config.py 失败。

[server]
# 服务器日志（stdio 传输下标准输出归协议使用，因此日志只写文件）
log_level = "info"
log_dir = "%USERPROFILE%\\AppData\\Local\\dsh-adobe-mcp\\logs"
# 标准输出只允许协议使用（stdio 传输），因此默认不向控制台打日志；调试时可设为 info，日志走 stderr。
console_log_level = "none"

[hosts.premiere]
# Premiere Pro 宿主
enabled = true
# 空表示自动选最高版本
version = ""
launch_on_demand = true
launch_timeout_s = 120
eval_timeout_s = 30

[hosts.media_encoder]
# Media Encoder 宿主（M5 阶段使用）
enabled = false
version = ""
launch_on_demand = false
launch_timeout_s = 120
eval_timeout_s = 30

[bridge]
# 桥接：握手目录、心跳与重连
handshake_dir = "%TEMP%\\dsh-adobe-mcp"
heartbeat_s = 5
reconnect_backoff_max_s = 30
handshake_poll_s = 0.5
connect_timeout_s = 5
auth_timeout_s = 3
max_response_chars = 100000

[extendscript]
# ExtendScript 方言与 QE 开关
# 启用未公开的 QE 接口；默认禁用（说明书 §6.2）
enable_qe = false
es3_static_check = true

[safety]
# 安全：检查点、确认令牌、路径白名单
checkpoint_before_t2 = true
checkpoint_dir = "%USERPROFILE%\\AppData\\Local\\dsh-adobe-mcp\\checkpoints"
max_checkpoints = 20
confirm_token_ttl_s = 300
# 导入/导出等路径参数的允许根目录；工程目录会在打开工程时自动加入。
allowed_path_roots = ["%USERPROFILE%"]

[tools]
# 工具组分段启用（说明书 §7.3）
enabled_groups = ["core", "project_edit", "timeline_edit"]

[jobs]
# 长任务模型
poll_interval_s = 5
max_concurrent_per_host = 1
max_queued_per_host = 8
state_dir = "%USERPROFILE%\\AppData\\Local\\dsh-adobe-mcp\\jobs"

[cep]
# CEP 面板部署
extension_id = "com.dsh.adobe.bridge"
source_dir = "F:\\MCP_Server\\dsh-Adobe-MCP\\cep-extension"
extensions_dir = "%USERPROFILE%\\AppData\\Roaming\\Adobe\\CEP\\extensions"
backup_dir = "%USERPROFILE%\\AppData\\Local\\dsh-adobe-mcp\\cep-backup"
# 是否在部署时设置 HKCU\Software\Adobe\CSXS.<n>\PlayerDebugMode。这是 Adobe 官方的扩展开发设置，只影响未签名扩展的加载，与宿主授权无关（说明书 §1.3）；默认 false，需要时由 scripts/dev_install_cep.ps1 显式设置。
set_player_debug_mode = false
script_timeout_s = 30

[export]
# 导出预设搜索路径
preset_dirs = []
